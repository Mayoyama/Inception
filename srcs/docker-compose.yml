services:
  wordpress:
    build: ./requirements/wordpress
    image: wordpress:v1
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_ADDRESS=${WP_ADMIN_ADDRESS}
      - WP_USER=${WP_USER}
      - WP_USER_ADDRESS=${WP_USER_ADDRESS}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: on-failure

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:v1
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

  nginx:
    build: ./requirements/nginx
    image: nginx:v1
    environment:
      - name=value
    secrets:
      - db_password
    volumes:
      - ?
    networks:
      - inception
    restart: on-failure

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  mysql:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/speterse/data/mysql
  wordpress: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/speterse/data/wordpress
      
networks:
  inception:
    driver: bridge
