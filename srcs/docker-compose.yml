services:
  wordpress:
    build: ./requirements/wordpress
    image: wordpress:v1
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_ADDRESS=${WP_ADMIN_ADDRESS}
      - WP_USER=${WP_USER}
      - WP_USER_ADDRESS=${WP_USER_ADDRESS}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: on-failure

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:v1
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

  nginx:
    build: ./requirements/nginx
    image: nginx:v1
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    ports:
      - "443:443"
    restart: on-failure

  portainer:
    build: ./requirements/bonus/portainer
    image: portainer:v1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - inception
    ports:
      - "9443:9443"
    restart: on-failure

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:v1
    networks:
      - inception
    ports:
      - "8080:8080"
    restart: on-failure

  redis:
    build: ./requirements/bonus/redis
    image: redis:v1
    networks:
      - inception
    restart: on-failure

  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:v1
    environment:
      - FTP_USER=${FTP_USER}
    secrets:
      - ftp_user_password
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    restart: on-failure

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_secrets.txt

volumes:
  mysql:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/shanep/data/mysql
  wordpress: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/shanep/data/wordpress
      
networks:
  inception:
    driver: bridge
